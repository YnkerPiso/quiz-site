<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start Page</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<button class="logout-btn" onclick="logout()">Logout</button>

<div class="circle" id="progress-circle">
  <div class="circle-text" id="progress-text">0%</div>
</div>

<div class="button-container">
  <button class="custom-button" onclick="startQuiz()">
    <span>Սկսել</span>
    <span class="arrow">›</span>
  </button>

  <button onclick="resetProgress()" class="reset-button">
    Reset Progress
  </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyANzIW_EqzkHVDzpZaD41LkMHugULjsFFk",
  authDomain: "quiz-app-e973d.firebaseapp.com",
  projectId: "quiz-app-e973d",
  storageBucket: "quiz-app-e973d.firebasestorage.app",
  messagingSenderId: "14843518571",
  appId: "1:14843518571:web:266c44f0a84001517c5b2e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "index.html";
  }
});

window.logout = function() {
  signOut(auth).then(() => {
    window.location.href = "index.html";
  });
};
</script>

<script>
function loadProgress() {
  fetch("questions.json")
    .then(res => res.json())
    .then(data => {
      const total = data.length;
      const saved = localStorage.getItem("answeredCorrectly");

      let correctCount = 0;

      if (saved) {
        const obj = JSON.parse(saved);
        correctCount = data.filter(q => obj[q.id]).length;
      }

      const percent = Math.round((correctCount / total) * 100);

      document.getElementById("progress-circle").style.background =
        `conic-gradient(#0f6d4d ${percent}%, #ddd ${percent}%)`;

      document.getElementById("progress-text").innerText = percent + "%";
    });
}

function resetProgress() {
  localStorage.removeItem("answeredCorrectly");
  loadProgress();
}

function startQuiz() {
  window.location.href = "nextpage.html";
}

loadProgress();
</script>

</body>
</html>
