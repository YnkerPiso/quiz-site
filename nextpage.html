<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main Page</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Back button */
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #0f6d4d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 1000;
    }

    .back-button:hover {
      background-color: #0c5a3f;
    }

    /* Wrapper */
    .wrapper {
      width: 100%;
      max-width: 600px;
    }

    /* Navigation */
    .nav {
      margin-top: 60px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      justify-content: center;
    }

    .nav button {
      background: #ddd;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Sections */
    .section {
      margin-top: 40px;
      text-align: center;
    }

    .section h1 {
      margin-bottom: 5px;
    }

    .section h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    /* Buttons */
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .custom-button {
      background-color: #0f6d4d;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 18px 20px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .custom-button:hover {
      background-color: #0c5a3f;
    }

    .arrow {
      font-size: 22px;
      transition: transform 0.3s ease;
    }

    .custom-button:hover .arrow {
      transform: translateX(5px);
    }
  </style>
</head>

<body>

  <!-- Back Arrow -->
  <button class="back-button" onclick="goBack()">←</button>

  <div class="wrapper">

    <!-- Navigation -->
    <div class="nav">
      <button onclick="scrollToSection('section1')">Section 1</button>
      <button onclick="scrollToSection('section2')">Section 2</button>
      <button onclick="scrollToSection('section3')">Section 3</button>
    </div>

    <!-- SECTION 1 -->
    <div id="section1" class="section">
      <h1>This text is above section 1.</h1>
      <h2>Section 1</h2>

      <div class="container">
        <button class="custom-button" onclick="openPage('page1.html')"><span>Button 1</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page2.html')"><span>Button 2</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page3.html')"><span>Button 3</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page4.html')"><span>Button 4</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page5.html')"><span>Button 5</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page6.html')"><span>Button 6</span><span class="arrow">›</span></button>
      </div>
    </div>

    <!-- SECTION 2 -->
    <div id="section2" class="section">
      <h1>This text is above section 2.</h1>
      <h2>Section 2</h2>

      <div class="container">
        <button class="custom-button" onclick="openPage('page7.html')"><span>Button 7</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page8.html')"><span>Button 8</span><span class="arrow">›</span></button>
      </div>
    </div>

    <!-- SECTION 3 -->
    <div id="section3" class="section">
      <h1>This text is above section 3.</h1>
      <h2>Section 3</h2>

      <div class="container">
        <button class="custom-button" onclick="openPage('page9.html')"><span>Button 9</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page10.html')"><span>Button 10</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page11.html')"><span>Button 11</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page12.html')"><span>Button 12</span><span class="arrow">›</span></button>
        <button class="custom-button" onclick="openPage('page13.html')"><span>Button 13</span><span class="arrow">›</span></button>
      </div>
    </div>

  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    function scrollToSection(id) {
      document.getElementById(id).scrollIntoView({
        behavior: "smooth"
      });
    }

    function openPage(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
