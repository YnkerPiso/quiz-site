<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 1</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #0f6d4d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .container {
      margin-top: 100px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .custom-button {
      background-color: #0f6d4d;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 18px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .arrow {
      font-size: 22px;
    }
  </style>
</head>

<body>

  <button class="back-button" onclick="goBack()">←</button>

  <div class="container">
    <button class="custom-button"><span>Option 1</span><span>›</span></button>
    <button class="custom-button"><span>Option 2</span><span>›</span></button>
    <button class="custom-button"><span>Option 3</span><span>›</span></button>
    <button class="custom-button"><span>Option 4</span><span>›</span></button>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>

</body>
</html>
