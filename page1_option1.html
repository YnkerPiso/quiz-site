<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz App</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

/* Back button */
.back-button {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #0f6d4d;
  color: white;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 28px;
  border: none;
  cursor: pointer;
}

/* Question */
.question {
  text-align: center;
  font-size: 22px;
  margin-top: 80px;
}

/* ✅ CENTERED IMAGE */
.question-image {
  display: block;
  margin: 20px auto;
  max-width: 300px;
  width: 100%;
  border-radius: 12px;
  object-fit: contain;
}

/* Answers */
.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  max-width: 800px;
  margin: 30px auto;
}

.answer {
  padding: 20px;
  border-radius: 10px;
  border: none;
  background: #eaeaea;
  cursor: pointer;
  transition: 0.2s;
}

.answer:hover {
  background: #ddd;
}

.correct {
  background: #0f6d4d !important;
  color: white;
}

.wrong {
  background: #c62828 !important;
  color: white;
}

/* Feedback */
.feedback {
  position: fixed;
  bottom: -100%;
  left: 0;
  width: 100%;
  color: white;
  transition: 0.4s;
  padding: 20px;
}

.feedback button {
  margin-top: 15px;
  width: 100%;
  padding: 15px;
  border-radius: 20px;
  border: none;
}

.show {
  bottom: 0;
}

.correct-bg {
  background: #0f6d4d;
}

.wrong-bg {
  background: #c62828;
}

/* Progress */
.progress-wrapper {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
}

.progress-container {
  width: 100%;
  height: 16px;
  background: #ddd;
  position: relative;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #0f6d4d;
  transition: width 0.6s ease;
}

.progress-text {
  position: absolute;
  right: 15px;
  bottom: 22px;
  font-size: 14px;
  font-weight: bold;
  color: #333;
}
</style>
</head>

<body>

<!-- Back -->
<button class="back-button" onclick="goBack()">←</button>

<!-- Question -->
<div id="question" class="question"></div>

<!-- ✅ IMAGE -->
<img id="question-image" class="question-image" style="display:none;">

<!-- Answers -->
<div id="answers" class="answers"></div>

<!-- Feedback -->
<div id="feedback" class="feedback">
  <h2 id="feedback-title"></h2>
  <p id="feedback-text"></p>
  <button onclick="nextQuestion()">ՇԱՐՈՒՆԱԿԵԼ</button>
</div>

<!-- Progress -->
<div class="progress-wrapper">
  <div class="progress-container">
    <div id="progress-bar" class="progress-bar"></div>
    <div id="progress-text" class="progress-text">0/0</div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
