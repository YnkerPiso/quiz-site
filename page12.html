<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 1 Options</title>
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #0f6d4d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 28px;
      cursor: pointer;
    }

    .container {
      margin-top: 100px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .custom-button {
      background-color: #0f6d4d;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 18px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .arrow {
      font-size: 22px;
    }
  </style>
</head>

<body>

  <button class="back-button" onclick="goBack()">←</button>

  <h2>Select an option</h2>

  <div class="container">
    <button class="custom-button" onclick="openPage('page12_option1.html')">
      <span>Option 1</span><span class="arrow">›</span>
    </button>

    <button class="custom-button" onclick="openPage('page12_option2.html')">
      <span>Option 2</span><span class="arrow">›</span>
    </button>

    <button class="custom-button" onclick="openPage('page12_option3.html')">
      <span>Option 3</span><span class="arrow">›</span>
    </button>

    <button class="custom-button" onclick="openPage('page12_option4.html')">
      <span>Option 4</span><span class="arrow">›</span>
    </button>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    function openPage(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
